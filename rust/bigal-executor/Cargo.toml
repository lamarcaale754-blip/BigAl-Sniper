[package]
name = "bigal-executor"
version = "0.1.0"
edition = "2021"
description = "Low-latency Solana trade executor for BigAl Sniper — Pump.fun instructions, Jito bundles, Yellowstone gRPC"

[features]
default = []
# gRPC feature disabled until yellowstone-grpc-proto is compatible with solana-sdk 4.x
# grpc = ["yellowstone-grpc-client", "yellowstone-grpc-proto", "tonic", "prost", "futures"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Solana core (4.x stable — types, signing, transactions)
solana-sdk = "4"
spl-token = "9"
spl-associated-token-account = "8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
bincode = "1"
bs58 = "0.5"

# ZeroMQ — pure Rust, no C deps needed on Windows
zeromq = "0.4"

# HTTP client (for RPC, Jito API, fee estimation)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# gRPC (Yellowstone Geyser) — temporarily removed due to solana-sdk 4.x incompatibility
# Re-add when yellowstone-grpc-proto releases a solana-sdk 4.x compatible version:
# yellowstone-grpc-client = { version = "3", optional = true }
# yellowstone-grpc-proto = { version = "3", optional = true }
# tonic = { version = "0.12", optional = true }
# prost = { version = "0.13", optional = true }
# futures = { version = "0.3", optional = true }

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrent collections
dashmap = "6"

# Misc
rand = "0.8"
dotenv = "0.15"
chrono = "0.4"
base64 = "0.22"
