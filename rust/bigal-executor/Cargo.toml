[package]
name = "bigal-executor"
version = "0.1.0"
edition = "2021"
description = "Low-latency Solana trade executor for BigAl Sniper — Pump.fun instructions, Jito bundles"

[features]
default = []
# Yellowstone Geyser (optional). See ../GRPC_RESOURCES.md — uncomment deps + line below when ready.
# grpc = ["yellowstone-grpc-client", "yellowstone-grpc-proto", "tonic", "prost", "futures"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("grpc"))'] }

[dependencies]
tokio = { version = "1", features = ["full"] }
solana-sdk = "4"
spl-token = "9"
spl-associated-token-account = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
bincode = "1"
bs58 = "0.5"
zeromq = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
rand = "0.8"
dotenv = "0.15"
chrono = "0.4"
base64 = "0.22"

# yellowstone-grpc-client = { version = "4.2.1", optional = true }
# yellowstone-grpc-proto = { version = "4.2.1", optional = true }
# tonic = { version = "0.12", optional = true }
# prost = { version = "0.13", optional = true }
# futures = { version = "0.3", optional = true }
